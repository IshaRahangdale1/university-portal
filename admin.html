<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — University Portal</title>
<style>
  :root{
    --orange:#f58220;
    --orange-dark:#d96a0c;
    --orange-soft:#fff3e8;
    --white:#ffffff;
    --bg:#f4f5f7;
    --ink:#23262b;
    --muted:#6b7280;
    --line:#e5e7eb;
    --ok:#1e7a4c;
    --pending:#a8700f;
    --bad:#b23a2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  input,select{
    width:100%;
    padding:11px 13px;
    border:1px solid #d1d5db;
    border-radius:6px;
    font-size:14.5px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus{
    outline:none;
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(245,130,32,0.18);
  }
  .field{margin-bottom:14px;}
  button{cursor:pointer;border:none;border-radius:6px;font-family:inherit;font-size:14px;}
  .btn-primary{
    background:var(--orange);color:#fff;font-weight:600;
    padding:12px 20px;transition:background .15s;
  }
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-primary:disabled{opacity:0.65;cursor:default;}
  .btn-secondary{background:#eef0f3;color:var(--ink);padding:11px 18px;font-weight:500;}
  .btn-secondary:hover{background:#e3e6ea;}
  .btn-danger{background:#fff;color:var(--bad);border:1px solid var(--bad);padding:10px 16px;font-weight:500;}
  .btn-danger:hover{background:#fdf0ee;}

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  #loginScreen .topbar{flex:0 0 auto;}
  .login-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }
  .login-card{
    width:100%;
    max-width:400px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,0.06);
    overflow:hidden;
  }
  .login-card .head{
    padding:14px 24px;
    background:var(--orange-soft);
    border-bottom:2px solid var(--orange);
    font-size:13.5px;
    font-weight:700;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--orange-dark);
  }
  .login-card .body{padding:22px 24px 26px;}
  .login-card p{margin:0 0 18px;font-size:14px;color:var(--muted);}
  .login-card .btn-primary{width:100%;margin-top:4px;}
  #loginError{
    display:none;margin-top:14px;padding:11px 13px;border-radius:6px;
    font-size:13px;color:var(--bad);background:#fdf0ee;border:1px solid #f3cfca;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--orange);
    color:#fff;
    padding:0 24px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  .topbar .title{font-size:20px;font-weight:600;letter-spacing:0.3px;}
  .topbar .title small{
    font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;
    margin-left:12px;padding:3px 10px;border-radius:20px;
    background:rgba(255,255,255,0.2);
  }
  .topbar button{
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.7);
    padding:8px 16px;font-weight:500;
  }
  .topbar button:hover{background:rgba(255,255,255,0.15);}

  /* ---------- Dashboard ---------- */
  #dashboard{display:none;}
  .pagehead{background:#fff;border-bottom:1px solid var(--line);}
  .pagehead .inner{
    max-width:1100px;margin:0 auto;padding:18px 24px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  }
  .pagehead h1{margin:0;font-size:20px;font-weight:500;}
  .pagehead h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;}
  .crumbs{font-size:12.5px;color:var(--muted);}
  .crumbs b{color:var(--orange-dark);font-weight:500;}

  main{max-width:1100px;margin:0 auto;padding:26px 20px 60px;}

  .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input[type=text]{max-width:320px;}
  .toolbar .spacer{flex:1;}
  .count{font-size:13px;color:var(--muted);}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,0.05);overflow:hidden;
  }
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
  th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);}
  th{
    background:var(--orange-soft);color:var(--orange-dark);
    font-size:11.5px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;
    border-bottom:2px solid var(--orange);
  }
  tbody tr:hover{background:#fffaf5;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill.approved{background:#e4f3eb;color:var(--ok);}
  .pill.pending{background:#fbeed9;color:var(--pending);}
  .pill.rejected{background:#f7e4e1;color:var(--bad);}
  .row-actions a{
    font-size:13px;color:var(--orange-dark);cursor:pointer;font-weight:600;text-decoration:none;
  }
  .row-actions a:hover{text-decoration:underline;}
  .empty{padding:44px;text-align:center;color:var(--muted);font-size:14px;}

  /* ---------- Modal ---------- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(20,14,8,0.55);
    align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .modal{
    background:#fff;width:100%;max-width:560px;border-radius:8px;
    max-height:90vh;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 70px rgba(0,0,0,0.35);
  }
  .modal-head{
    padding:15px 24px;background:var(--orange);color:#fff;
    font-size:16px;font-weight:600;
  }
  .modal-body{padding:22px 24px 8px;overflow-y:auto;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:10px;
    padding:14px 24px;border-top:1px solid var(--line);background:#fafafa;
  }
  #formError{
    display:none;margin:0 0 14px;padding:11px 13px;border-radius:6px;
    font-size:13px;color:var(--bad);background:#fdf0ee;border:1px solid #f3cfca;
  }

  @media (max-width:640px){
    .topbar{padding:0 14px;height:56px;}
    .topbar .title{font-size:16px;}
    .topbar .title small{display:none;}
    .pagehead .inner{padding:14px 16px;}
    main{padding:18px 12px 40px;}
    .grid2{grid-template-columns:1fr;gap:0;}
    .toolbar input[type=text]{max-width:none;flex:1 1 100%;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <header class="topbar">
    <div class="title">University Portal <small>Admin</small></div>
  </header>
  <div class="login-wrap">
    <div class="login-card">
      <div class="head">Admin Sign In</div>
      <div class="body">
        <p>Sign in to manage student records.</p>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="username" />
        </div>
        <div class="field">
          <label for="loginPass">Password</label>
          <input id="loginPass" type="password" autocomplete="current-password" />
        </div>
        <button class="btn-primary" id="loginBtn">Sign in</button>
        <div id="loginError"></div>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header class="topbar">
    <div class="title">University Portal <small>Admin</small></div>
    <button id="logoutBtn">Sign out</button>
  </header>

  <div class="pagehead">
    <div class="inner">
      <h1>Student Records <small>Manage admissions</small></h1>
      <div class="crumbs">Home &nbsp;›&nbsp; <b>Students</b></div>
    </div>
  </div>

  <main>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search name or registration no." />
      <span class="count" id="countLabel"></span>
      <div class="spacer"></div>
      <button class="btn-primary" id="addBtn">+ Add Student</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Reg. No.</th><th>Course</th><th>Year</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" style="display:none;">No students yet. Click "Add Student" to begin.</div>
    </div>
  </main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head" id="modalTitle">Add Student</div>
    <div class="modal-body">
      <input type="hidden" id="f_id" />
      <div class="field">
        <label>Student Photo</label>
        <input id="f_photo" type="file" accept="image/*" />
        <img id="f_photo_preview" src="" alt="" style="display:none;margin-top:8px;max-width:90px;border-radius:4px;border:1px solid var(--line);" />
      </div>
      <div class="field">
        <label>Full Name</label>
        <input id="f_name" type="text" />
      </div>
      <div class="grid2">
        <div class="field">
          <label>Registration Number</label>
          <input id="f_reg" type="text" />
        </div>
        <div class="field">
          <label>Date of Birth</label>
          <input id="f_dob" type="date" />
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Form No.</label>
          <input id="f_formno" type="text" />
        </div>
        <div class="field">
          <label>Father's Name</label>
          <input id="f_father" type="text" />
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Faculty</label>
          <input id="f_faculty" type="text" placeholder="e.g. Faculty of Commerce and Management" />
        </div>
        <div class="field">
          <label>Course Type</label>
          <input id="f_coursetype" type="text" placeholder="e.g. Under Graduate" />
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Course Name</label>
          <input id="f_course" type="text" />
        </div>
        <div class="field">
          <label>Academic Year</label>
          <input id="f_year" type="text" placeholder="e.g. 2024-25" />
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Gender</label>
          <select id="f_gender">
            <option value="">—</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Category</label>
          <input id="f_category" type="text" placeholder="e.g. General" />
        </div>
      </div>
      <div class="field">
        <label>Nationality</label>
        <input id="f_nationality" type="text" placeholder="e.g. Indian" />
      </div>
      <div class="grid2">
        <div class="field">
          <label>Admission Status</label>
          <select id="f_status">
            <option>Pending</option>
            <option>Approved</option>
            <option>Rejected</option>
          </select>
        </div>
        <div class="field">
          <label>Admission Date</label>
          <input id="f_admdate" type="date" />
        </div>
      </div>
      <div class="field">
        <label>Student Email (optional)</label>
        <input id="f_email" type="email" />
      </div>
      <div id="formError"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn" style="display:none;margin-right:auto;">Delete</button>
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

  // ===== CONFIGURE THESE TWO VALUES after you create your Supabase project =====
  const SUPABASE_URL = 'https://kifbsigxzeteabccgmoc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_gDap5xp7TRkdXTHgY6i-vA_jAkdH4-r';
  // ===============================================================================

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  let allStudents = [];

  // ---- AUTH ----
  async function checkSession(){
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { showDashboard(); } else { showLogin(); }
  }
  function showLogin(){ loginScreen.style.display='flex'; dashboard.style.display='none'; }
  function showDashboard(){ loginScreen.style.display='none'; dashboard.style.display='block'; loadStudents(); }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = 'Invalid email or password.';
      errEl.style.display = 'block';
      return;
    }
    showDashboard();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    showLogin();
  });

  // ---- LOAD + RENDER ----
  async function loadStudents(){
    const { data, error } = await supabase
      .from('students')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allStudents = data || [];
    render(allStudents);
  }

  function pillClass(s){
    if (s === 'Approved') return 'approved';
    if (s === 'Rejected') return 'rejected';
    return 'pending';
  }

  function render(list){
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('emptyState');
    document.getElementById('countLabel').textContent =
      allStudents.length ? `${list.length} of ${allStudents.length} students` : '';
    tbody.innerHTML = '';
    if (list.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    for (const s of list) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(s.full_name)}</td>
        <td>${escapeHtml(s.registration_number)}</td>
        <td>${escapeHtml(s.course_name)}</td>
        <td>${escapeHtml(s.academic_year)}</td>
        <td><span class="pill ${pillClass(s.admission_status)}">${escapeHtml(s.admission_status)}</span></td>
        <td class="row-actions"><a data-id="${s.id}" class="editLink">Edit</a></td>
      `;
      tbody.appendChild(tr);
    }
    document.querySelectorAll('.editLink').forEach(a => {
      a.addEventListener('click', () => openModal(list.find(s => s.id === a.dataset.id)));
    });
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    render(allStudents.filter(s =>
      s.full_name.toLowerCase().includes(q) || s.registration_number.toLowerCase().includes(q)
    ));
  });

  // ---- MODAL ----
  const overlay = document.getElementById('overlay');
  function openModal(student){
    document.getElementById('formError').style.display = 'none';
    document.getElementById('modalTitle').textContent = student ? 'Edit Student' : 'Add Student';
    document.getElementById('f_id').value = student?.id || '';
    document.getElementById('f_name').value = student?.full_name || '';
    document.getElementById('f_reg').value = student?.registration_number || '';
    document.getElementById('f_dob').value = student?.date_of_birth || '';
    document.getElementById('f_course').value = student?.course_name || '';
    document.getElementById('f_year').value = student?.academic_year || '';
    document.getElementById('f_status').value = student?.admission_status || 'Pending';
    document.getElementById('f_admdate').value = student?.admission_date || '';
    document.getElementById('f_email').value = student?.email || '';
    document.getElementById('f_formno').value = student?.form_no || '';
    document.getElementById('f_faculty').value = student?.faculty || '';
    document.getElementById('f_coursetype').value = student?.course_type || '';
    document.getElementById('f_father').value = student?.fathers_name || '';
    document.getElementById('f_gender').value = student?.gender || '';
    document.getElementById('f_category').value = student?.category || '';
    document.getElementById('f_nationality').value = student?.nationality || '';
    document.getElementById('f_photo').value = '';
    const preview = document.getElementById('f_photo_preview');
    if (student?.photo_url) {
      preview.src = student.photo_url;
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
    document.getElementById('deleteBtn').style.display = student ? 'inline-block' : 'none';
    overlay.style.display = 'flex';
  }
  document.getElementById('f_photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('f_photo_preview');
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  });

  document.getElementById('addBtn').addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', () => overlay.style.display = 'none');

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const id = document.getElementById('f_id').value;
    const errEl = document.getElementById('formError');
    const saveBtn = document.getElementById('saveBtn');
    const regForUpload = document.getElementById('f_reg').value.trim();

    // Upload photo first, if a new one was chosen
    let photoUrl = document.getElementById('f_photo_preview').src || null;
    if (!document.getElementById('f_photo_preview').style.display || document.getElementById('f_photo_preview').style.display === 'none') {
      photoUrl = null;
    }
    const fileInput = document.getElementById('f_photo');
    if (fileInput.files && fileInput.files[0]) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Uploading photo…';
      const file = fileInput.files[0];
      const ext = file.name.split('.').pop();
      const path = `${regForUpload || 'student'}-${Date.now()}.${ext}`;
      const { error: uploadError } = await supabase.storage
        .from('student-photos')
        .upload(path, file, { upsert: true });
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
      if (uploadError) {
        errEl.textContent = 'Photo upload failed: ' + uploadError.message;
        errEl.style.display = 'block';
        return;
      }
      const { data: pub } = supabase.storage.from('student-photos').getPublicUrl(path);
      photoUrl = pub.publicUrl;
    }

    const payload = {
      full_name: document.getElementById('f_name').value.trim(),
      registration_number: document.getElementById('f_reg').value.trim(),
      date_of_birth: document.getElementById('f_dob').value,
      course_name: document.getElementById('f_course').value.trim(),
      academic_year: document.getElementById('f_year').value.trim(),
      admission_status: document.getElementById('f_status').value,
      admission_date: document.getElementById('f_admdate').value || null,
      email: document.getElementById('f_email').value.trim() || null,
      form_no: document.getElementById('f_formno').value.trim() || null,
      faculty: document.getElementById('f_faculty').value.trim() || null,
      course_type: document.getElementById('f_coursetype').value.trim() || null,
      fathers_name: document.getElementById('f_father').value.trim() || null,
      gender: document.getElementById('f_gender').value || null,
      category: document.getElementById('f_category').value.trim() || null,
      nationality: document.getElementById('f_nationality').value.trim() || null,
      photo_url: photoUrl,
    };
    if (!payload.full_name || !payload.registration_number || !payload.date_of_birth || !payload.course_name || !payload.academic_year) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.style.display = 'block';
      return;
    }
    let error;
    if (id) {
      ({ error } = await supabase.from('students').update(payload).eq('id', id));
    } else {
      ({ error } = await supabase.from('students').insert(payload));
    }
    if (error) {
      errEl.textContent = error.message.includes('duplicate') ? 'That registration number already exists.' : 'Could not save. Please try again.';
      errEl.style.display = 'block';
      return;
    }
    overlay.style.display = 'none';
    loadStudents();
  });

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    const id = document.getElementById('f_id').value;
    if (!id) return;
    if (!confirm('Delete this student record? This cannot be undone.')) return;
    const { error } = await supabase.from('students').delete().eq('id', id);
    if (!error) { overlay.style.display = 'none'; loadStudents(); }
  });

  checkSession();
</script>
</body>
</html>
