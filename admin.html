<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin :: AIU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#f58220;
    --navy:#2a1a6e;
    --navy-dark:#1c1050;
    --navy-ink:#1f2a5c;
    --gold:#f59e0b;
    --bg:#ecf0f5;
    --ink:#333;
    --muted:#666;
    --line:#d9d9d9;
    --ok:#1e7a4c;
    --pending:#a8700f;
    --bad:#b23a2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:"Source Sans 3","Open Sans",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  button{cursor:pointer;border:none;border-radius:6px;font-family:inherit;font-size:14px;}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#334155;margin-bottom:6px;}
  input,select{width:100%;padding:11px 13px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,130,32,.18);}
  .field{margin-bottom:14px;}
  .btn-primary{background:var(--orange);color:#fff;font-weight:600;padding:11px 20px;}
  .btn-primary:hover{background:#d96a0c;}
  .btn-primary:disabled{opacity:.65;cursor:default;}
  .btn-secondary{background:#eef0f3;color:var(--ink);padding:11px 18px;font-weight:500;}
  .btn-secondary:hover{background:#e3e6ea;}
  .btn-danger{background:#fff;color:var(--bad);border:1px solid var(--bad);padding:10px 16px;font-weight:500;}
  .btn-danger:hover{background:#fdf0ee;}

  /* Logo */
  .logo{display:flex;align-items:center;gap:6px;color:#fff;}
  .logo svg{width:50px;height:50px;flex:0 0 50px;}
  .logo .lt{font-family:Arial,sans-serif;font-weight:700;line-height:1;}
  .logo .lt div{display:flex;align-items:center;gap:3px;font-size:11px;letter-spacing:.2px;margin-bottom:2px;}
  .logo .lt b{display:inline-block;width:12px;height:12px;line-height:12px;text-align:center;background:#fff;color:var(--navy);font-size:10px;}
  .logo .lt small{display:block;font-size:5px;font-weight:600;letter-spacing:.1px;margin-top:3px;white-space:nowrap;}

  /* Login */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    font-family:Inter,Arial,sans-serif;
    background:linear-gradient(160deg,#f97316 0%,#8a4a4a 45%,#3b2a7a 100%);
  }
  .lcard{width:100%;max-width:400px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .lhead{background:var(--gold);color:#fff;text-align:center;padding:30px 20px 18px;position:relative;}
  .lhead .badge{position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .lhead h2{margin:0;font-size:21px;font-weight:700;letter-spacing:1px;line-height:1.3;}
  .lhead p{margin:8px 0 0;font-size:10px;letter-spacing:1.8px;opacity:.9;}
  .lbody{padding:24px 20px 26px;}
  .lbody input{background:#f8fafc;border-color:#e2e8f0;border-radius:8px;padding:13px 14px;font-size:13.5px;}
  .lbtn{width:100%;padding:14px;border:none;border-radius:8px;background:var(--gold);color:#fff;font-size:13px;font-weight:700;letter-spacing:1px;box-shadow:0 6px 14px rgba(245,158,11,.35);}
  .lbtn:hover{background:#e08e07;}
  #loginError,#formError{display:none;margin-top:14px;padding:11px 13px;border-radius:6px;font-size:13px;color:var(--bad);background:#fdf0ee;border:1px solid #f3cfca;}
  #formError{margin:0 0 14px;}

  /* Dashboard */
  #dashboard{display:none;}
  .top{height:57px;background:var(--orange);display:flex;align-items:center;justify-content:space-between;}
  .top .brand{padding:0 10px;}
  .top .out{color:#fff;font-size:12px;background:none;padding:0 20px;font-family:"Open Sans",Arial,sans-serif;}
  .wrap{display:flex;min-height:calc(100vh - 57px);}
  .side{width:230px;flex:0 0 230px;background:var(--navy);padding-top:5px;}
  .side div{display:flex;align-items:center;gap:8px;padding:13px 12px;color:#fff;font-family:"Open Sans",Arial,sans-serif;font-size:11.5px;background:var(--navy-dark);}
  .content{flex:1;min-width:0;}
  .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #d2d6de;}
  .ph h1{margin:0;font-size:20px;font-weight:400;}
  .ph h1 small{font-size:12.5px;color:#777;margin-left:6px;}
  .crumb{font-family:"Open Sans",Arial,sans-serif;font-size:10px;color:#444;}
  .page{background:#fff;margin:0 15px 20px 0;border-top:3px solid var(--navy-ink);padding:16px 22px 30px;min-height:300px;}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input[type=text]{max-width:320px;}
  .toolbar .spacer{flex:1;}
  .count{font-size:13px;color:var(--muted);}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);}
  th{background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  tbody tr:hover{background:#f6f4fc;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill.approved{background:#e4f3eb;color:var(--ok);}
  .pill.pending{background:#fbeed9;color:var(--pending);}
  .pill.rejected{background:#f7e4e1;color:var(--bad);}
  .row-actions a{font-size:13px;color:var(--navy);cursor:pointer;font-weight:600;}
  .row-actions a:hover{text-decoration:underline;}
  .empty{padding:44px;text-align:center;color:var(--muted);font-size:14px;}

  /* Modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(20,14,40,.55);align-items:center;justify-content:center;padding:20px;z-index:30;}
  .modal{background:#fff;width:100%;max-width:560px;border-radius:8px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.35);}
  .modal-head{padding:15px 24px;background:var(--orange);color:#fff;font-size:16px;font-weight:600;}
  .modal-body{padding:22px 24px 8px;overflow-y:auto;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:#fafafa;}

  @media (max-width:760px){
    .side{display:none;}
    .ph{padding:10px 12px;}
    .ph h1{font-size:17px;}
    .ph h1 small,.crumb{display:none;}
    .page{margin:0;padding:12px 12px 30px;border-radius:0;}
    input,select{font-size:16px;min-height:46px;}
    input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;}
    .grid2{grid-template-columns:1fr;gap:0;}
    .toolbar .spacer{display:none;}
    .toolbar input[type=text]{max-width:none;flex:1 1 100%;}
    .count:empty{display:none;}
    .count{flex:1 1 100%;}
    .toolbar .btn-primary{width:100%;padding:13px;}

    .table-wrap{border:none;overflow:visible;}
    table{min-width:0;display:block;}
    thead{display:none;}
    tbody{display:block;}
    tbody tr{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:12px;padding:4px 14px 14px;}
    tbody tr:hover{background:#fff;}
    tbody tr td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-align:right;word-break:break-word;}
    tbody tr td::before{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left;flex:0 0 auto;}
    tbody tr td:nth-child(1){font-size:15.5px;font-weight:600;justify-content:flex-start;text-align:left;}
    tbody tr td:nth-child(2)::before{content:"Reg. No.";}
    tbody tr td:nth-child(3)::before{content:"Course";}
    tbody tr td:nth-child(4)::before{content:"Year";}
    tbody tr td:nth-child(5)::before{content:"Status";}
    tbody tr td:last-child{display:block;border-bottom:none;padding:14px 0 0;}
    td.row-actions a{display:block;text-align:center;padding:11px;border:1px solid var(--navy);border-radius:6px;}
    .empty{border:1px solid var(--line);border-radius:8px;padding:32px 16px;}

    .overlay{padding:0;align-items:stretch;}
    .modal{max-width:none;max-height:none;height:100vh;height:100dvh;border-radius:0;}
    .modal-head{padding:14px 16px;}
    .modal-body{padding:18px 16px 8px;}
    .modal-actions{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap;}
    .modal-actions button{flex:1 1 0;padding:13px;}
    #deleteBtn{flex:1 1 100% !important;margin-right:0 !important;order:3;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="lcard">
    <div class="lhead">
      <div class="badge">AIU</div>
      <h2>ASIAN INTERNATIONAL<br>UNIVERSITY</h2>
      <p>CMS ADMIN LOGIN</p>
    </div>
    <div class="lbody">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" placeholder="admin@example.com" />
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password" />
      </div>
      <button class="lbtn" id="loginBtn">SIGN IN TO PORTAL</button>
      <div id="loginError"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="24" fill="#fff"/><circle cx="25" cy="25" r="21" fill="none" stroke="#2a1a6e" stroke-width="2"/><circle cx="25" cy="25" r="15" fill="#2a1a6e"/><circle cx="25" cy="25" r="11" fill="none" stroke="#f5b942" stroke-width="1.5"/><path d="M25 15l3 7h-6zM17 28h16l-2 5H19z" fill="#f5b942"/></svg>
        <div class="lt">
          <div><b>A</b>ASIAN</div>
          <div><b>I</b>INTERNATIONAL</div>
          <div><b>U</b>UNIVERSITY</div>
          <small>ESTABLISHED UNDER SECTION 2(F) OF UGC ACT, 1956.</small>
        </div>
      </div>
    </div>
    <button class="out" id="logoutBtn">Logout</button>
  </header>

  <div class="wrap">
    <aside class="side"><div>Student Records</div></aside>
    <div class="content">
      <div class="ph">
        <h1>Student Records <small>Manage admissions</small></h1>
        <div class="crumb">Home &nbsp;&gt;&nbsp; Students</div>
      </div>
      <div class="page">
        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="Search name or registration no." />
          <span class="count" id="countLabel"></span>
          <div class="spacer"></div>
          <button class="btn-primary" id="addBtn">+ Add Student</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Reg. No.</th><th>Course</th><th>Year</th><th>Status</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="emptyState" style="display:none;">No students yet. Click "Add Student" to begin.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head" id="modalTitle">Add Student</div>
    <div class="modal-body">
      <input type="hidden" id="f_id" />
      <div class="field">
        <label>Student Photo</label>
        <input id="f_photo" type="file" accept="image/*" />
        <img id="f_photo_preview" src="" alt="" style="display:none;margin-top:8px;max-width:90px;border-radius:4px;border:1px solid var(--line);" />
      </div>
      <div class="field"><label>Full Name</label><input id="f_name" type="text" /></div>
      <div class="grid2">
        <div class="field"><label>Registration Number</label><input id="f_reg" type="text" /></div>
        <div class="field"><label>Date of Birth</label><input id="f_dob" type="date" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Form No.</label><input id="f_formno" type="text" /></div>
        <div class="field"><label>Father's Name</label><input id="f_father" type="text" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Faculty</label><input id="f_faculty" type="text" placeholder="e.g. Faculty of Commerce and Management" /></div>
        <div class="field"><label>Course Type</label><input id="f_coursetype" type="text" placeholder="e.g. Under Graduate" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Course Name</label><input id="f_course" type="text" /></div>
        <div class="field"><label>Academic Year</label><input id="f_year" type="text" placeholder="e.g. 2024-25" /></div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Gender</label>
          <select id="f_gender">
            <option value="">—</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field"><label>Category</label><input id="f_category" type="text" placeholder="e.g. General" /></div>
      </div>
      <div class="field"><label>Nationality</label><input id="f_nationality" type="text" placeholder="e.g. Indian" /></div>
      <div class="grid2">
        <div class="field">
          <label>Status</label>
          <select id="f_status">
            <option value="Pending">Pending</option>
            <option value="Approved">Pass</option>
            <option value="Rejected">Fail</option>
          </select>
        </div>
        <div class="field"><label>Admission Date</label><input id="f_admdate" type="date" /></div>
      </div>
      <div class="field"><label>Student Email (optional)</label><input id="f_email" type="email" /></div>
      <div id="formError"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn" style="display:none;margin-right:auto;">Delete</button>
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

  const SUPABASE_URL = 'https://kifbsigxzeteabccgmoc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_gDap5xp7TRkdXTHgY6i-vA_jAkdH4-r';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  let allStudents = [];

  // ---- AUTH ----
  async function checkSession(){
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { showDashboard(); } else { showLogin(); }
  }
  function showLogin(){ loginScreen.style.display='flex'; dashboard.style.display='none'; }
  function showDashboard(){ loginScreen.style.display='none'; dashboard.style.display='block'; loadStudents(); }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = 'Invalid email or password.';
      errEl.style.display = 'block';
      return;
    }
    showDashboard();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    showLogin();
  });

  // ---- LOAD + RENDER ----
  async function loadStudents(){
    const { data, error } = await supabase
      .from('students')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    allStudents = data || [];
    render(allStudents);
  }

  function pillClass(s){
    if (s === 'Approved') return 'approved';
    if (s === 'Rejected') return 'rejected';
    return 'pending';
  }
  // Stored value stays Approved/Rejected/Pending; shown as Pass/Fail/Pending
  function statusLabel(s){
    if (s === 'Approved') return 'Pass';
    if (s === 'Rejected') return 'Fail';
    return s || 'Pending';
  }

  function render(list){
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('emptyState');
    document.getElementById('countLabel').textContent =
      allStudents.length ? `${list.length} of ${allStudents.length} students` : '';
    tbody.innerHTML = '';
    if (list.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    for (const s of list) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(s.full_name)}</td>
        <td>${escapeHtml(s.registration_number)}</td>
        <td>${escapeHtml(s.course_name)}</td>
        <td>${escapeHtml(s.academic_year)}</td>
        <td><span class="pill ${pillClass(s.admission_status)}">${escapeHtml(statusLabel(s.admission_status))}</span></td>
        <td class="row-actions"><a data-id="${s.id}" class="editLink">Edit</a></td>
      `;
      tbody.appendChild(tr);
    }
    document.querySelectorAll('.editLink').forEach(a => {
      a.addEventListener('click', () => openModal(list.find(s => s.id === a.dataset.id)));
    });
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    render(allStudents.filter(s =>
      s.full_name.toLowerCase().includes(q) || s.registration_number.toLowerCase().includes(q)
    ));
  });

  // ---- MODAL ----
  const overlay = document.getElementById('overlay');
  function openModal(student){
    document.getElementById('formError').style.display = 'none';
    document.getElementById('modalTitle').textContent = student ? 'Edit Student' : 'Add Student';
    document.getElementById('f_id').value = student?.id || '';
    document.getElementById('f_name').value = student?.full_name || '';
    document.getElementById('f_reg').value = student?.registration_number || '';
    document.getElementById('f_dob').value = student?.date_of_birth || '';
    document.getElementById('f_course').value = student?.course_name || '';
    document.getElementById('f_year').value = student?.academic_year || '';
    document.getElementById('f_status').value = student?.admission_status || 'Pending';
    document.getElementById('f_admdate').value = student?.admission_date || '';
    document.getElementById('f_email').value = student?.email || '';
    document.getElementById('f_formno').value = student?.form_no || '';
    document.getElementById('f_faculty').value = student?.faculty || '';
    document.getElementById('f_coursetype').value = student?.course_type || '';
    document.getElementById('f_father').value = student?.fathers_name || '';
    document.getElementById('f_gender').value = student?.gender || '';
    document.getElementById('f_category').value = student?.category || '';
    document.getElementById('f_nationality').value = student?.nationality || '';
    document.getElementById('f_photo').value = '';
    const preview = document.getElementById('f_photo_preview');
    if (student?.photo_url) {
      preview.src = student.photo_url;
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
    document.getElementById('deleteBtn').style.display = student ? 'inline-block' : 'none';
    overlay.style.display = 'flex';
  }
  document.getElementById('f_photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('f_photo_preview');
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  });

  document.getElementById('addBtn').addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', () => overlay.style.display = 'none');

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const id = document.getElementById('f_id').value;
    const errEl = document.getElementById('formError');
    const saveBtn = document.getElementById('saveBtn');
    const regForUpload = document.getElementById('f_reg').value.trim();

    let photoUrl = document.getElementById('f_photo_preview').src || null;
    if (!document.getElementById('f_photo_preview').style.display || document.getElementById('f_photo_preview').style.display === 'none') {
      photoUrl = null;
    }
    const fileInput = document.getElementById('f_photo');
    if (fileInput.files && fileInput.files[0]) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Uploading photo…';
      const file = fileInput.files[0];
      const ext = file.name.split('.').pop();
      const path = `${regForUpload || 'student'}-${Date.now()}.${ext}`;
      const { error: uploadError } = await supabase.storage
        .from('student-photos')
        .upload(path, file, { upsert: true });
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
      if (uploadError) {
        errEl.textContent = 'Photo upload failed: ' + uploadError.message;
        errEl.style.display = 'block';
        return;
      }
      const { data: pub } = supabase.storage.from('student-photos').getPublicUrl(path);
      photoUrl = pub.publicUrl;
    }

    const payload = {
      full_name: document.getElementById('f_name').value.trim(),
      registration_number: document.getElementById('f_reg').value.trim(),
      date_of_birth: document.getElementById('f_dob').value,
      course_name: document.getElementById('f_course').value.trim(),
      academic_year: document.getElementById('f_year').value.trim(),
      admission_status: document.getElementById('f_status').value,
      admission_date: document.getElementById('f_admdate').value || null,
      email: document.getElementById('f_email').value.trim() || null,
      form_no: document.getElementById('f_formno').value.trim() || null,
      faculty: document.getElementById('f_faculty').value.trim() || null,
      course_type: document.getElementById('f_coursetype').value.trim() || null,
      fathers_name: document.getElementById('f_father').value.trim() || null,
      gender: document.getElementById('f_gender').value || null,
      category: document.getElementById('f_category').value.trim() || null,
      nationality: document.getElementById('f_nationality').value.trim() || null,
      photo_url: photoUrl,
    };
    if (!payload.full_name || !payload.registration_number || !payload.date_of_birth || !payload.course_name || !payload.academic_year) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.style.display = 'block';
      return;
    }
    let error;
    if (id) {
      ({ error } = await supabase.from('students').update(payload).eq('id', id));
    } else {
      ({ error } = await supabase.from('students').insert(payload));
    }
    if (error) {
      errEl.textContent = error.message.includes('duplicate') ? 'That registration number already exists.' : 'Could not save. Please try again.';
      errEl.style.display = 'block';
      return;
    }
    overlay.style.display = 'none';
    loadStudents();
  });

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    const id = document.getElementById('f_id').value;
    if (!id) return;
    if (!confirm('Delete this student record? This cannot be undone.')) return;
    const { error } = await supabase.from('students').delete().eq('id', id);
    if (!error) { overlay.style.display = 'none'; loadStudents(); }
  });

  checkSession();
</script>
</body>
</html>
